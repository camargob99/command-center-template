# Command Center in the cloud. setup.js fills in database_id and ALLOWED_EMAIL.
name = "command-center"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[vars]
TZ = "America/New_York"
ALLOWED_EMAIL = ""

[[d1_databases]]
binding = "DB"
database_name = "command-center"
database_id = "SET_BY_SETUP"
